version: '3.8'

services:
  # DEV Environment
  postgres_dev:
    image: postgres:16-alpine
    container_name: snaploka_postgres_dev
    environment:
      POSTGRES_USER: snaploka_app
      POSTGRES_PASSWORD: snaploka_dev_password
      POSTGRES_DB: snaploka_dev
    ports:
      - "5432:5432"
    volumes:
      - snaploka_dev_pg_data:/var/lib/postgresql/data

  redis_dev:
    image: redis:7-alpine
    container_name: snaploka_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - snaploka_dev_redis_data:/data

  # UAT Environment 
  postgres_uat:
    image: postgres:16-alpine
    container_name: snaploka_postgres_uat
    environment:
      POSTGRES_USER: snaploka_app
      POSTGRES_PASSWORD: snaploka_uat_password
      POSTGRES_DB: snaploka_uat
    ports:
      - "5433:5432"
    volumes:
      - snaploka_uat_pg_data:/var/lib/postgresql/data
  redis_uat:
    image: redis:7-alpine
    container_name: snaploka_redis_uat
    ports:
      - "6380:6379"
    volumes:
      - snaploka_uat_redis_data:/data

volumes:
  snaploka_dev_pg_data:
  snaploka_dev_redis_data:
  snaploka_uat_pg_data:
  snaploka_uat_redis_data: